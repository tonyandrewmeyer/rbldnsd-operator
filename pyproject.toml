[project]
name = "rbldnsd-operator"
version = "1.0.0a2"
requires-python = ">=3.10"

dependencies = [
    "charmlibs-apt>=1,<2",
    "charmlibs-systemd>=1,<2",
    "ops~=3.7",
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
    "ty",
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
integration = [
    "jubilant>=1.8,<2",
    "pytest",
    "pytest-jubilant>=2.0.1,<3",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["src"]

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[dependency-groups]
dev = [
    "zizmor>=1.28.0",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
extra-paths = ["src"]
